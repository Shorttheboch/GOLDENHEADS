# GOLDENHEADS · HEADS Rescate Dorado — Netlify config
# Netlify runs `npm run build` (Vite) and publishes dist/. The ranking function lives in netlify/functions.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Built code has a fingerprint in its name (index-XXXX.js), so browsers can keep it for good.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# v75: the service worker and the manifest must never be kept for long, or a new version would not reach the phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
