# GOLDENHEADS · HEADS Rescate Dorado — Netlify, from v85 on: only a redirect.
# The game moved to Cloudflare Workers: https://goldenheads2021.com/headsrescue/ (wrangler.jsonc, worker/, tools/cloudflare/make-site.mjs).
# Built from main, Netlify publishes a folder with one file and sends every address of heads-rescate-dorado.netlify.app to the same place on the
# new site, for good (301), with its query string (Netlify passes it on by itself): / -> /headsrescue/, /privacidad/ -> /headsrescue/privacidad/,
# /admin -> /headsrescue/admin, /?ronda=14 -> /headsrescue/?ronda=14. No functions, no Vite build.
# The API stays at the root of the new site (/api/..., not under /headsrescue/). A game tab opened on the old address before the move cannot
# follow it there (another origin: the browser blocks it), so its ranking and stats just fail quietly, as when the server is down.
[build]
  command = "mkdir -p netlify-redirect && echo ok > netlify-redirect/index.html"
  publish = "netlify-redirect"

[[redirects]]
  from = "/api/*"
  to = "https://goldenheads2021.com/api/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://goldenheads2021.com/headsrescue/:splat"
  status = 301
  force = true
